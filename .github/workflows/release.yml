name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance, no NPM_TOKEN needed
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Check tag matches package.json version
        run: test "${{ github.event.release.tag_name }}" = "v$(node -p 'require("./package.json").version')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm publish --provenance --no-git-checks
